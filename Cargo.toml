[package]
name = "pirate-radio"
version = "0.1.0"
edition = "2021"

[workspace]
members = [
    "src/block",
    "src/identity",
    "src/pns",
    "src/storage",
    "src/sync",
    "src/transport",
    "src/integrations",
]

[dependencies]
pirate-block = { path = "src/block" }
pirate-identity = { path = "src/identity" }
pirate-pns = { path = "src/pns" }
pirate-storage = { path = "src/storage" }
pirate-sync = { path = "src/sync" }
pirate-transport = { path = "src/transport" }
pirate-integrations = { path = "src/integrations" }

tokio = { version = "1.0", features = ["full"] }
axum = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
